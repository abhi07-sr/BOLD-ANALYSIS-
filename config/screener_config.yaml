# Screener Configuration File
# Analyst-editable thresholds, presets, and composite score parameters

# Default metric threshold limits
metric_thresholds:
  roe_min: 15.0
  debt_to_equity_max: 1.0
  free_cash_flow_min: 0.0
  revenue_cagr_5yr_min: 10.0
  pat_cagr_5yr_min: 15.0
  opm_min: 15.0
  pe_ratio_max: 25.0
  pb_ratio_max: 5.0
  dividend_yield_min: 1.0
  interest_coverage_min: 3.0
  market_cap_min: 20000.0
  net_profit_min: 1000.0
  eps_cagr_min: 10.0
  asset_turnover_min: 0.8
  sales_min: 5000.0

# 6 Preset Screeners
presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE compounders with low leverage, positive free cash flow, and sustained 5Y top-line growth."
    filters:
      return_on_equity_pct: { min: 15.0 }
      debt_to_equity: { max: 1.0 }
      free_cash_flow_cr: { min: 0.0 }
      revenue_cagr_5yr: { min: 10.0 }

  value_pick:
    name: "Value Pick"
    description: "Undervalued large caps with reasonable P/E and P/B multiples, manageable debt, and dividend yield."
    filters:
      pe_ratio: { min: 0.0, max: 25.0 }
      pb_ratio: { min: 0.0, max: 5.0 }
      debt_to_equity: { max: 2.0 }
      dividend_yield_pct: { min: 1.0 }

  growth_accelerator:
    name: "Growth Accelerator"
    description: "Rapidly expanding businesses delivering >20% 5Y PAT CAGR and >15% 5Y Revenue CAGR with controlled debt."
    filters:
      pat_cagr_5yr: { min: 20.0 }
      revenue_cagr_5yr: { min: 15.0 }
      debt_to_equity: { max: 2.0 }

  dividend_champion:
    name: "Dividend Champion"
    description: "Generous income generators yielding >2%, sustainable payout <80%, and backed by positive FCF."
    filters:
      dividend_yield_pct: { min: 2.0 }
      dividend_payout: { min: 0.0, max: 80.0 }
      free_cash_flow_cr: { min: 0.0 }

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Substantial revenue powerhouses (>Rs 5000 Cr) operating virtually debt-free with double-digit ROE."
    filters:
      debt_to_equity: { max: 0.05 }
      return_on_equity_pct: { min: 12.0 }
      sales: { min: 5000.0 }

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Accelerating revenue (>10% 3Y CAGR), positive latest FCF, and declining leverage year-over-year."
    filters:
      revenue_cagr_3yr: { min: 10.0 }
      free_cash_flow_cr: { min: 0.0 }
      de_declining: true

# Composite Quality Score Weights (Sums to 1.00)
composite_score_weights:
  # 35% Profitability
  profitability:
    return_on_equity_pct: 0.15
    return_on_capital_employed_pct: 0.10
    net_profit_margin_pct: 0.10

  # 30% Cash Quality
  cash_quality:
    fcf_growth: 0.15
    cfo_pat_ratio: 0.10
    fcf_positive_flag: 0.05

  # 20% Growth
  growth:
    revenue_cagr_5yr: 0.10
    pat_cagr_5yr: 0.10

  # 15% Leverage
  leverage:
    debt_to_equity: 0.10     # Inverted (lower D/E -> higher score)
    interest_coverage: 0.05  # Higher ICR -> higher score (Debt Free = 100)

# Winsorization thresholds
winsorization:
  p_low: 0.10
  p_high: 0.90

